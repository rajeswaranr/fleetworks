user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css text/plain;
    gzip_min_length 1000;

    # Root directory for HLS files
    root /var/www;

    # HTTP server for HLS streaming
    server {
        listen 8080 default_server;
        server_name _;

        # HLS endpoint - serves .m3u8 and .ts files
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            # Cache headers - playlists update frequently
            add_header Cache-Control "max-age=3, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Serve index for directory listing
            autoindex on;
            autoindex_format json;
        }

        # Health check endpoint
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin "*";
        }

        # Control endpoint for stopping streams
        location /control {
            rtmp_control all;
            add_header Access-Control-Allow-Origin "*";
        }

        # Root status page
        location / {
            add_header Content-Type text/html;
            return 200 '
                <!DOCTYPE html>
                <html>
                <head>
                    <title>FleetWorks Streaming Server</title>
                    <style>
                        body { font-family: Arial; padding: 20px; }
                        h1 { color: #333; }
                        .status { background: #f0f0f0; padding: 10px; margin: 10px 0; }
                        .ok { color: green; }
                        .error { color: red; }
                    </style>
                </head>
                <body>
                    <h1>🎥 FleetWorks Live Streaming Server</h1>
                    <div class="status">
                        <p><strong>RTMP Server:</strong> <span class="ok">✓ Running on port 1935</span></p>
                        <p><strong>HLS Output:</strong> <span class="ok">✓ Available at /hls/</span></p>
                        <p><strong>Status Page:</strong> <a href="/stat">/stat</a></p>
                    </div>
                    <h2>Active Streams</h2>
                    <div id="streams" class="status">Loading...</div>
                    <script>
                        fetch("/stat?format=json")
                            .then(r => r.json())
                            .then(data => {
                                const streams = data.rtmp?.server?.[0]?.application?.[0]?.live?.[0]?.stream || [];
                                const html = streams.length ?
                                    "<ul>" + streams.map(s =>
                                        `<li>${s.name} - ${s.time}ms (${s.bw_in} bps in, ${s.bw_out} bps out)</li>`
                                    ).join("") + "</ul>"
                                    : "No active streams";
                                document.getElementById("streams").innerHTML = html;
                            });
                    </script>
                </body>
                </html>
            ';
        }
    }
}

# RTMP server configuration
rtmp {
    server {
        listen 1935 so_keepalive=on;
        chunk_size 4096;
        max_connections 1000;

        # Notify URL (optional - post stream events)
        # notify_method get;
        # notify_url http://localhost/stat;

        # Main application - receives RTMP streams from cameras
        application live {
            live on;
            record off;

            # Allow all clients to connect
            allow publish all;
            allow play all;

            # Push to HLS application for transcoding
            push rtmp://localhost:1935/hls;

            # Per-stream callback (optional)
            # on_publish http://localhost:8000/publish;
            # on_play http://localhost:8000/play;
            # on_done http://localhost:8000/done;
        }

        # HLS output application
        application hls {
            live on;
            record off;

            # Enable HLS streaming
            hls on;
            hls_path /var/www/hls;
            hls_fragment 3s;
            hls_playlist_length 12;
            hls_sync 100ms;

            # HLS variants for adaptive bitrate (optional)
            # hls_variant _360 BANDWIDTH=2500000;
            # hls_variant _rear BANDWIDTH=2500000;
            # hls_variant _forward BANDWIDTH=2500000;
            # hls_variant _cabin BANDWIDTH=2500000;

            # DVR (disk-based recording) - keep last 1 hour
            dvr on;
            dvr_path /var/www/recordings;
            dvr_playlist_length 60m;
            dvr_cleanup_interval 1m;

            # Prevent unauthorized publishing
            allow publish 127.0.0.1;
            deny publish all;

            allow play all;
        }

        # Optional: Transcode application (CPU intensive)
        # application transcode {
        #     live on;
        #
        #     exec ffmpeg -i rtmp://localhost:1935/$app/$name
        #         -c:v libx264 -preset ultrafast -b:v 1000k
        #         -c:a aac -b:a 64k
        #         -f flv rtmp://localhost:1935/hls/$name;
        # }

        # Dashboard application (for player to fetch streams)
        application dashboard {
            live on;
            record off;

            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }
    }
}
