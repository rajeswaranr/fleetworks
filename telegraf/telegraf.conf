# Telegraf Configuration for FleetWorks Vehicle Telemetry
# Collects GPS, OBD-II, and sensor data from fleet vehicles
# Send to: Supabase (via Edge Function), InfluxDB (optional)

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"
  precision = ""
  hostname = "fleetworks-telegraf-gateway"
  omit_hostname = false

# ======= INPUTS: Data Collection =======

# MQTT Consumer - Read from vehicle IoT devices
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER:mosquitto.local:1883}"]
  topics = [
    "vehicle/+/gps",
    "vehicle/+/obd",
    "vehicle/+/events"
  ]
  data_format = "json"
  name_override = "vehicle_telemetry"

  # MQTT connection settings
  username = "${MQTT_USERNAME:fleetworks}"
  password = "${MQTT_PASSWORD:change-me}"
  client_id = "telegraf-fleetworks"
  qos = 1
  connection_timeout = "30s"
  max_undelivered_messages = 1000

  # Message parsing
  tag_keys = ["vehicle_id", "source"]
  field_keys = ["lat", "lon", "speed", "rpm", "fuel", "temp"]

# HTTP Input - Poll Samsara API (optional, if not using webhooks)
# [[inputs.http]]
#   urls = ["https://api.samsara.com/v1/vehicles"]
#   headers = {
#     "Authorization" = "Bearer ${SAMSARA_API_TOKEN}"
#   }
#   data_format = "json"
#   name_override = "samsara_vehicles"
#   interval = "30s"

# GPS Serial Input - Direct USB GPS module
# [[inputs.exec]]
#   commands = ["/opt/read-gps.sh"]
#   data_format = "json"
#   name_override = "gps_position"
#   interval = "5s"

# System Metrics (Telegraf gateway health)
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  metrics_collection_interval = "10s"

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs"]

[[inputs.diskio]]

# ======= OUTPUTS: Data Destinations =======

# Primary: Supabase Edge Function (Telemetry Ingestion)
[[outputs.http]]
  url = "${SUPABASE_FUNCTION_URL:https://your-project.supabase.co/functions/v1/telemetry-ingest}"
  data_format = "json"
  method = "POST"
  timeout = "10s"

  # Authentication
  headers = {
    "Authorization" = "Bearer ${SUPABASE_ANON_KEY}",
    "Content-Type" = "application/json"
  }

  # Batch settings
  metric_batch_size = 100

  # Response handling
  skip_verify = false
  use_batch_format = true

# Optional: InfluxDB Cloud (if using free tier for dashboards)
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL:https://us-west-2-1.aws.cloud2.influxdata.com}"]
  token = "${INFLUXDB_TOKEN:}"
  organization = "${INFLUXDB_ORG:fleetworks}"
  bucket = "${INFLUXDB_BUCKET:vehicle_metrics}"

  # Only send if token is configured
  # Delete this section if not using InfluxDB
  [outputs.influxdb_v2.tagpass]
    # Only send vehicle_telemetry metrics to InfluxDB
    measurement = ["vehicle_telemetry"]

# Optional: Local file for debugging
[[outputs.file]]
  files = ["/var/log/telegraf/vehicle-telemetry.log"]
  data_format = "json"
  rotation_max_archives = 7  # Keep 7 days of logs

  # Only log errors
  [outputs.file.tagpass]
    level = ["error", "warn"]

# ======= PROCESSORS: Data Transformation =======

# Add org_id tag to all metrics
[[processors.rename]]
  [processors.rename.tags]
    vehicle_id = "vehicle_id"

  [[processors.rename.replace]]
    field = "vehicle_id"
    dest = "device_id"

# Parse timestamps correctly
[[processors.date]]
  field = "timestamp"
  format = "unix_ms"
  dest = "timestamp"
  timezone = "Asia/Kolkata"  # India timezone

# ======= AGGREGATOR PLUGINS =======

# Track vehicle arrival/departure events
[[aggregators.final]]
  measurement_name = "vehicle_events"
  grace_period = "30s"
  drop_original = false

# ======= CONFIGURATION END =======

# Logging settings
[global_tags]
  fleet = "fleetworks"
  environment = "production"
  region = "ap-south-1"  # Mumbai

[outputs]
  # Disable logging for high-volume HTTP output
  quiet = false

# Debug mode (set to true for troubleshooting)
debug = false
quiet = false
