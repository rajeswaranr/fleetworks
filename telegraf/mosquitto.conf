# Mosquitto MQTT Broker Configuration for FleetWorks

# Default listener - unencrypted (for internal network)
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords.txt
max_connections -1
max_queued_messages 1000

# WebSocket listener (for web clients)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwords.txt

# TLS listener (for production/external access)
# Uncomment when SSL certificates are available
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /mosquitto/config/passwords.txt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_type all

# Message settings
max_inflight_messages 40
message_size_limit 0

# Security
allow_zero_length_clientid false

# Performance tuning
autosave_interval 1800
autosave_on_changes false

# ACl settings (topics users can access)
acl_file /mosquitto/config/aclfile.txt
